kind: pipeline
type: docker
name: schema-migrate

steps:
  - name: schema-migrate
    image: python:3.11-slim
    environment:
      DATABASE_URL:
        from_secret: amsz_database_url
      LOG_LEVEL:
        value: INFO
    commands:
      - pip install --no-cache-dir -r requirements-dev.txt
      - chmod +x ci/run_migration.sh
      - ./ci/run_migration.sh
